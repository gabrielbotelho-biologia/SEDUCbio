<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guia de Estudos · Professor de Biologia SEDUC-MA</title>
<style>
:root{--bg:#f1f7f2;--card:rgba(255,255,255,.72);--bd:rgba(20,90,50,.18);--tx:#12301f;--mut:#51705e;--ac:#1f9d55;--ac2:#0e6b3a;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a12;--card:rgba(255,255,255,.07);--bd:rgba(120,220,160,.2);--tx:#e6f4ea;--mut:#9ebfae;--ac:#3ddc84;--ac2:#7ff0b0;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1a12;--card:rgba(255,255,255,.07);--bd:rgba(120,220,160,.2);--tx:#e6f4ea;--mut:#9ebfae;--ac:#3ddc84;--ac2:#7ff0b0;--warn:#fbbf24;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 10% -10%,rgba(61,220,132,.18),transparent),var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;backdrop-filter:blur(14px);background:var(--card)}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:900px;margin:auto}
h1{font-size:1.05rem;margin:0}
h2{font-size:1.2rem;margin:.2rem 0 .6rem;color:var(--ac2)}
h3{margin:.2rem 0;font-size:1rem}
.sub{color:var(--mut);font-size:.8rem}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:8px;max-width:900px;margin-inline:auto}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
nav{display:flex;gap:6px;overflow-x:auto;max-width:900px;margin:8px auto 0;padding-bottom:2px}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 13px;font:inherit;font-size:.85rem;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:auto;padding:14px}
section{display:none;animation:f .3s}section.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px;backdrop-filter:blur(8px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat b{display:block;font-size:1.25rem;color:var(--ac2)}
.stat span{font-size:.78rem;color:var(--mut)}
details{border:1px solid var(--bd);border-radius:14px;background:var(--card);margin:0 0 10px;overflow:hidden}
